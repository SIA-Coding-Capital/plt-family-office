name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    # Chaque matin vers 6 h à Paris : le site est reconstruit et l'article du jour sort.
    - cron: '5 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire
        run: npm run build
        env:
          # Sans domaine personnalisé, le site est servi sous /plt-family-office sur github.io.
          SITE_URL: ${{ vars.CUSTOM_DOMAIN && format('https://{0}', vars.CUSTOM_DOMAIN) || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN && '/' || format('/{0}', github.event.repository.name) }}
          PUBLICATION_START: ${{ vars.PUBLICATION_START || '2026-11-02' }}
      - name: Domaine personnalisé
        if: ${{ vars.CUSTOM_DOMAIN }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
