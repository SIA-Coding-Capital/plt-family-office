name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    # Chaque matin vers 6 h à Paris : le site est reconstruit et l'article du jour sort.
    - cron: '5 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire
        run: npm run build
        env:
          # Le site est servi à la racine du domaine (la variable CUSTOM_DOMAIN permet d'en changer).
          SITE_URL: https://${{ vars.CUSTOM_DOMAIN || 'www.plt-family-office.com' }}
          BASE_PATH: /
          PUBLICATION_START: ${{ vars.PUBLICATION_START || '2026-10-20' }}
          PUBLICATION_FIRST_BATCH: ${{ vars.PUBLICATION_FIRST_BATCH || '10' }}
      - name: Domaine personnalisé
        run: echo "${{ vars.CUSTOM_DOMAIN || 'www.plt-family-office.com' }}" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
